# .github/workflows/deploy.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  AR_REPO: a2a-marketplace
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/a2a-marketplace

permissions:
  contents: read
  id-token: write

jobs:
  # ════════════════════════════════════════════════
  # JOB 1: Run all unit tests
  # ════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: a2a_password
          POSTGRES_DB: a2a_marketplace
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[web-search,data-analysis,document,code,dev]"

      - name: Create test .env
        run: |
          cat > .env << EOF
          GOOGLE_API_KEY=test-key-for-unit-tests
          AGENT_MODEL=gemini-flash-lite-latest
          ORCHESTRATOR_MODEL=gemini-flash-latest
          A2A_BEARER_TOKEN=dev-bearer-token
          JWT_SECRET_KEY=test-secret-key-for-ci
          POSTGRES_URL=postgresql://a2a:a2a_password@localhost:5432/a2a_marketplace
          REDIS_URL=redis://localhost:6379
          ENVIRONMENT=test
          EOF

      - name: Run unit tests
        run: |
          pytest tests/ \
            -m "not integration" \
            -v \
            --tb=short \
            --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml


  # ════════════════════════════════════════════════
  # JOB 2: Build and push Docker images
  # ════════════════════════════════════════════════
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Generate image tag
        id: meta
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build and push all images
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          REGISTRY=${{ env.REGISTRY }}

          declare -A SERVICES=(
            ["registry"]="registry/Dockerfile"
            ["web-search-agent"]="agents/web_search/Dockerfile"
            ["data-analysis-agent"]="agents/data_analysis/Dockerfile"
            ["document-agent"]="agents/document/Dockerfile"
            ["code-agent"]="agents/code/Dockerfile"
            ["orchestrator"]="orchestrator/Dockerfile"
          )

          for service in "${!SERVICES[@]}"; do
            dockerfile="${SERVICES[$service]}"
            image="$REGISTRY/$service:$TAG"
            latest="$REGISTRY/$service:latest"

            echo "Building $service..."
            docker build \
              -f "$dockerfile" \
              -t "$image" \
              -t "$latest" \
              --cache-from "$latest" \
              . &
          done

          wait
          echo "All images built"

          for service in "${!SERVICES[@]}"; do
            docker push "$REGISTRY/$service:$TAG" &
            docker push "$REGISTRY/$service:latest" &
          done

          wait
          echo "All images pushed"


  # ════════════════════════════════════════════════
  # JOB 3: Deploy to Cloud Run
  # ════════════════════════════════════════════════
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.get-orchestrator-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ── Registry (deployed first, min=1, always up) ──────────────────
      - name: Deploy Registry
        run: |
          TAG=${{ needs.build.outputs.image-tag }}
          IMAGE="${{ env.REGISTRY }}/registry:$TAG"

          gcloud run deploy a2a-registry \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=9000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=300 \
            --cpu-boost \
            --set-cloudsql-instances="${{ secrets.DB_CONNECTION_NAME }}" \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-secrets="POSTGRES_URL=POSTGRES_URL:latest,A2A_BEARER_TOKEN=A2A_BEARER_TOKEN:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,REGISTRY_PORT=9000" \
            --project="${{ env.PROJECT_ID }}"

      - name: Get Registry URL
        id: registry-url
        run: |
          URL=$(gcloud run services describe a2a-registry \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Registry URL: $URL"

      # ── Specialist Agents ─────────────────────────────────────────────
      # KEY FIX: Get existing URL BEFORE deploy so AGENT_SELF_URL is
      # correct in the first revision. Cloud Run URLs never change.
      # On first-ever deploy the URL is empty → deploy without it →
      # immediately update. All subsequent deploys get URL upfront.
      - name: Deploy Specialist Agents
        run: |
          TAG=${{ needs.build.outputs.image-tag }}
          REGISTRY_URL=${{ steps.registry-url.outputs.url }}

          deploy_agent() {
            local name=$1
            local image_name=$2
            local port=$3
            local extra_secrets=$4
            local extra_env=$5

            IMAGE="${{ env.REGISTRY }}/$image_name:$TAG"

            # Get stable URL BEFORE deploying new revision.
            # On first deploy this returns empty string.
            SELF_URL=$(gcloud run services describe "$name" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format="value(status.url)" 2>/dev/null || echo "")

            echo "Deploying $name (self_url='$SELF_URL')..."

            gcloud run deploy "$name" \
              --image="$IMAGE" \
              --region="${{ env.REGION }}" \
              --platform=managed \
              --allow-unauthenticated \
              --port="$port" \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=5 \
              --concurrency=10 \
              --timeout=300 \
              --cpu-boost \
              --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
              --set-secrets="A2A_BEARER_TOKEN=A2A_BEARER_TOKEN:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,AGENT_MODEL=AGENT_MODEL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest$extra_secrets" \
              --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,REGISTRY_URL=$REGISTRY_URL,AGENT_SELF_URL=$SELF_URL$extra_env" \
              --project="${{ env.PROJECT_ID }}"

            # First-ever deploy: SELF_URL was empty, fix it now.
            # URL is stable so this is the only time we need this path.
            if [ -z "$SELF_URL" ]; then
              SELF_URL=$(gcloud run services describe "$name" \
                --region="${{ env.REGION }}" \
                --project="${{ env.PROJECT_ID }}" \
                --format="value(status.url)")

              echo "First deploy of $name — updating AGENT_SELF_URL to $SELF_URL"

              gcloud run services update "$name" \
                --region="${{ env.REGION }}" \
                --project="${{ env.PROJECT_ID }}" \
                --update-env-vars="AGENT_SELF_URL=$SELF_URL"
            fi

            echo "$name ready at: $SELF_URL"
          }

          deploy_agent "a2a-web-search-agent" \
            "web-search-agent" \
            "8001" \
            "" \
            ",WEB_SEARCH_AGENT_PORT=8001"

          deploy_agent "a2a-data-analysis-agent" \
            "data-analysis-agent" \
            "8002" \
            "" \
            ",DATA_ANALYSIS_AGENT_PORT=8002,MPLBACKEND=Agg"

          deploy_agent "a2a-document-agent" \
            "document-agent" \
            "8003" \
            "" \
            ",DOCUMENT_AGENT_PORT=8003"

          deploy_agent "a2a-code-agent" \
            "code-agent" \
            "8004" \
            "" \
            ",CODE_AGENT_PORT=8004,TMPDIR=/tmp"

      # ── Orchestrator (deployed last, needs agent URLs in registry) ────
      - name: Deploy Orchestrator
        run: |
          TAG=${{ needs.build.outputs.image-tag }}
          IMAGE="${{ env.REGISTRY }}/orchestrator:$TAG"
          REGISTRY_URL=${{ steps.registry-url.outputs.url }}

          SELF_URL=$(gcloud run services describe a2a-orchestrator \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(status.url)" 2>/dev/null || echo "")

          gcloud run deploy a2a-orchestrator \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=5 \
            --timeout=300 \
            --cpu-boost \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-secrets="A2A_BEARER_TOKEN=A2A_BEARER_TOKEN:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,ORCHESTRATOR_MODEL=ORCHESTRATOR_MODEL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,ORCHESTRATOR_PORT=8000,REGISTRY_URL=$REGISTRY_URL,AGENT_SELF_URL=$SELF_URL" \
            --project="${{ env.PROJECT_ID }}"

          if [ -z "$SELF_URL" ]; then
            SELF_URL=$(gcloud run services describe a2a-orchestrator \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format="value(status.url)")

            gcloud run services update a2a-orchestrator \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --update-env-vars="AGENT_SELF_URL=$SELF_URL"
          fi

          echo "Orchestrator ready at: $SELF_URL"

      - name: Get Orchestrator URL
        id: get-orchestrator-url
        run: |
          URL=$(gcloud run services describe a2a-orchestrator \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      # ── Wake agents so they register before smoke tests ───────────────
      - name: Wake agents and wait for registration
        run: |
          echo "Pinging all agents to trigger cold start + registration..."

          for SERVICE in a2a-web-search-agent a2a-data-analysis-agent a2a-document-agent a2a-code-agent; do
            URL=$(gcloud run services describe "$SERVICE" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format="value(status.url)")
            echo -n "$SERVICE → "
            curl -s --max-time 30 "$URL/health" | python3 -m json.tool 2>/dev/null || echo "cold (will register on first request)"
          done

          echo "Waiting 30s for agents to register with registry..."
          sleep 30

          echo "Registry agent status:"
          REGISTRY_URL=${{ steps.registry-url.outputs.url }}
          curl -s "$REGISTRY_URL/agents" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['agents']:
              print(f\"  {a['name']:30} {a['url']:60} {a['status']}\")
          print(f\"  Total: {data['total']}, Active: {data['active_count']}\")
          "

      # ── Smoke tests ───────────────────────────────────────────────────
      - name: Smoke Tests
        run: |
          ORCH_URL=${{ steps.get-orchestrator-url.outputs.url }}
          REGISTRY_URL=${{ steps.registry-url.outputs.url }}
          BEARER="${{ secrets.A2A_BEARER_TOKEN }}"
          FAILED=0

          check() {
            local label=$1
            local status=$2
            local expected=$3
            if [[ "$status" == "$expected" ]]; then
              echo "✅ $label"
            else
              echo "❌ $label (got $status, want $expected)"
              FAILED=$((FAILED + 1))
            fi
          }

          # Registry health
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$REGISTRY_URL/health")
          check "Registry /health" "$STATUS" "200"

          # Orchestrator health
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ORCH_URL/health")
          check "Orchestrator /health" "$STATUS" "200"

          # Orchestrator agent card (public endpoint)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ORCH_URL/.well-known/agent.json")
          check "Orchestrator agent card" "$STATUS" "200"

          # Auth required on task endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$ORCH_URL/a2a/tasks/send" \
            -H "Content-Type: application/json" \
            -d '{}')
          check "Task endpoint requires auth" "$STATUS" "401"

          # Agent health checks (now public)
          for SERVICE in a2a-web-search-agent a2a-data-analysis-agent a2a-document-agent a2a-code-agent; do
            URL=$(gcloud run services describe "$SERVICE" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format="value(status.url)")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health")
            check "$SERVICE /health" "$STATUS" "200"
          done

          # Active agents in registry
          ACTIVE=$(curl -s "$REGISTRY_URL/agents" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['active_count'])")
          if [[ "$ACTIVE" -ge 3 ]]; then
            echo "✅ Registry has $ACTIVE active agents"
          else
            echo "❌ Registry only has $ACTIVE active agents (want ≥3)"
            FAILED=$((FAILED + 1))
          fi

          echo ""
          if [[ "$FAILED" -eq 0 ]]; then
            echo "All smoke tests passed ✅"
          else
            echo "$FAILED smoke test(s) failed ❌"
            exit 1
          fi

      - name: Post deployment summary
        if: always()
        run: |
          ORCH_URL=${{ steps.get-orchestrator-url.outputs.url }}
          REGISTRY_URL=${{ steps.registry-url.outputs.url }}
          TAG=${{ needs.build.outputs.image-tag }}

          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Orchestrator | $ORCH_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | $REGISTRY_URL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY