# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-marketplace"
version = "0.1.0"
description = "Multi-Agent Marketplace using A2A and MCP protocols"
requires-python = ">=3.12"

dependencies = [
    # Web framework - each agent is a FastAPI service
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    
    # A2A Protocol - Google's official SDK (April 2025)
    "a2a-sdk>=0.2.0",
    
    # MCP Protocol - Anthropic's official SDK
    "mcp>=2.0.0",
    
    # LLM - Gemini (free tier)
    "google-genai>=0.8.0",
    
    # Agent framework - LangGraph
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.0",          # DB migrations
    
    # Cache
    "redis>=5.0.0",
    "hiredis>=2.3.0",           # Fast Redis parser
    
    # HTTP client for A2A communication
    "httpx>=0.27.0",
    
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0", # .env file loading
    
    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",        # Structured logging
    "tenacity>=8.3.0",          # Retry logic
]

[project.optional-dependencies]
# Tools used by specific agents
web-search = [
    "google-search-results>=2.4.2",  # SerpAPI (has free tier)
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]
data-analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]
document = [
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]
code = [
    #"black>=24.0.0",
    #"pylint>=3.2.0",
    "radon>=6.0.1",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",              # Linter
    "mypy>=1.10.0",             # Type checker
]

[tool.setuptools.packages.find]
# Tell setuptools to ONLY look in these directories
# This fixes the "multiple top-level packages" error
include = [
    "shared*",
    "agents*",
    "registry*",
    "orchestrator*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live services (PostgreSQL, etc.)",
]
asyncio_mode = "auto"
testpaths = ["tests"]